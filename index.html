   下載失敗時自動改回 GitHub 本站，並記住，下次直接用本站 */
window.__CDN={base:'https://cdn.jsdelivr.net/gh/onerkk/swamp-angler@main/',on:localStorage.getItem('swampAngler.cdn')!=='off',
  url(u){ try{ if(!this.on||!u||/^(https?:|data:|blob:)/.test(u)||!/\.(glb|jpg|jpeg|png|webp|hdr|mp3)(\?|$)/i.test(u)) return u; return this.base+u.replace(/^\.?\//,''); }catch(e){ return u; } },
  fail(u){ if(this.on&&u&&u.indexOf(this.base)===0){ this.on=false; try{ localStorage.setItem('swampAngler.cdn','off'); }catch(e){} console.warn('CDN 下載失敗，改用本站',u); } }};

<div id="intro">
  <h1>濕地垂釣</h1>
  <div class="en">SWAMP ANGLER</div>
  <p><b>按住</b>按鈕蓄力，在力道最滿時放開拋竿。浮標被拉進水裡時<b>立刻點擊</b>提竿。拉扯時<b>按住收線</b>；魚衝刺就放手，並往魚游走的<b>反方向滑動</b>拉竿，別讓張力爆表。拖曳畫面可以轉向瞄準。</p>
  <button id="startBtn">開始釣魚</button>
  <script>
// 錯誤直接顯示在載入畫面上（手機看不到主控台）：有問題時截圖就能看出原因
window.__ERRS=[]; window.addEventListener('error',e=>{ try{ const m=(e.message||'')+' @'+((e.filename||'').split('/').pop())+':'+(e.lineno||''); window.__ERRS.push(m); const t=document.getElementById('loadErr'); if(t){ t.style.display='block'; t.textContent='⚠️ 發生錯誤：'+window.__ERRS.slice(-3).join(' ｜ '); } }catch(x){} });
window.addEventListener('unhandledrejection',e=>{ try{ const r=e.reason, m=(r&&(r.message||r.code))||String(r); window.__ERRS.push('promise: '+m); }catch(x){} });
</script>
<div id="loadBox"><div id="loadNote">正在載入真實場景…</div><div id="loadBar"><i></i></div><div id="loadTip"></div><div id="loadErr" style="display:none;margin-top:6px;font-size:12px;color:#ff9a8a;word-break:break-all"></div></div>
<style>#loadBox{margin-top:14px;width:min(320px,84vw)}#loadBar{height:6px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:6px}#loadBar i{display:block;height:100%;width:3%;background:linear-gradient(90deg,#ffcf66,#ffe9b0);border-radius:99px;transition:width .4s}
#loadTip{font-size:12px;line-height:1.6;opacity:.75;margin-top:8px}#loadBox.done #loadBar{display:none}#loadBox.done #loadTip{display:none}</style>

function showErr(h){var e=document.getElementById('err');e.innerHTML=h;e.classList.remove('hidden');}
</script>
<script>
/* 主程式載入器：先試 CDN（快），檢查版本號一致才執行；不一致或失敗就改從本站下載。依序執行兩個檔案 */
(function(){ var V='20261029134205', CDN='https://cdn.jsdelivr.net/gh/onerkk/swamp-angler@main/', F=['app_scan.js','app_main.js'], useCdn=localStorage.getItem('swampAngler.cdn')!=='off';
  var note=function(t){ var e=document.getElementById('loadTip'); if(e&&t) e.textContent=t; };
  function run(code){ var b=new Blob([code],{type:'text/javascript'}), s=document.createElement('script'); s.src=URL.createObjectURL(b); return new Promise(function(ok){ s.onload=ok; s.onerror=ok; document.body.appendChild(s); }); }
  function get(u){ return fetch(u,{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }); }
  function one(f){ var local=function(){ return get(f+'?v='+V); };
    var p=useCdn?get(CDN+f).then(function(t){ if(t.indexOf('/*APPV:'+V+'*/')!==0) throw new Error('stale'); return t; }).catch(local):local();
    return p.then(run); }
  note('正在下載遊戲主程式…'); one(F[0]).then(function(){ return one(F[1]); }).catch(function(e){ var x=document.getElementById('loadErr'); if(x){ x.style.display='block'; x.textContent='⚠️ 主程式下載失敗：'+e+'，請重新整理'; } });
})();
</script>
